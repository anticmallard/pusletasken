<style>
/* Standalone app: keep content clear of the notch and home bar */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}

<title>Pusletasken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: category shelves of big two-up tiles on a dotted paper ground; single deliberate light look */
:root{
  --navy:#001E3F; --burgundy:#4E141E; --mauve:#8A5862; --forest:#4B573D; --mustard:#A86F16;
  --blush:#E3C6BD; --paper:#F1EFEB; --dot:#E2DED7; --line:#DCE3E8;
  --display:"Lilita One", "Nunito", ui-rounded, system-ui, sans-serif;
  --body:"Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:24px 24px;
  color:var(--navy);font-family:var(--body);font-size:17px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 130px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--burgundy);outline-offset:3px}
svg.ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

header{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:64px;height:64px;flex:none;transform:rotate(-6deg)}
.brand-text{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1;margin:0}
.tag{font-weight:600;font-size:.92rem;color:var(--forest)}
.mode{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0}
.status{display:flex;align-items:center;gap:12px;font-weight:800}
.bar{flex:1;height:16px;border-radius:10px;background:#fff;border:2.5px solid var(--navy);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--burgundy);transition:width .35s ease}
.count{font-variant-numeric:tabular-nums;white-space:nowrap}
.ready{font-weight:800;font-size:1.1rem;background:var(--forest);color:#fff;border:2.5px solid var(--navy);border-radius:18px;padding:12px 14px;text-align:center;box-shadow:4px 4px 0 var(--navy)}

.cat{display:flex;flex-direction:column;gap:12px}
.cat-head{display:flex;align-items:center;gap:10px}
.cat-ic{width:42px;height:42px;border-radius:12px;border:2.5px solid var(--navy);display:grid;place-items:center;flex:none;color:#fff}
.cat-ic svg{width:25px;height:25px;stroke-width:2.4}
.cat-head h2{margin:0;flex:1;font-family:var(--display);font-weight:400;font-size:1.5rem}
.chip{font-weight:800;font-size:.95rem;padding:4px 12px;border-radius:99px;border:2px solid var(--navy);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;min-height:140px;border:2.5px solid var(--navy);border-radius:22px;background:#fff;box-shadow:4px 4px 0 var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 8px;transition:transform .15s ease,box-shadow .15s ease,background .15s}
.tile .pic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:var(--navy)}
.tile .pic svg{width:48px;height:48px;stroke-width:1.9}
.tile .name{font-weight:700;font-size:1.05rem;text-align:center;overflow-wrap:anywhere}
.tile .badge{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;color:#fff}
.tile .badge svg{width:16px;height:16px;stroke-width:3.5}
.tile[aria-checked="true"]{box-shadow:0 0 0 var(--navy);transform:translate(3px,3px)!important}
.tile[aria-checked="true"] .name{text-decoration:line-through;text-decoration-thickness:2px;opacity:.7}
.tile[aria-checked="true"] .pic{opacity:.55}

.erow{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--navy);border-radius:18px;padding:6px 8px 6px 6px;min-height:62px}
.erow .pic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.erow .pic svg{width:30px;height:30px;stroke-width:2}
.erow .name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.iconbtn{width:42px;height:42px;border-radius:12px;border:2px solid var(--navy);background:var(--paper);display:grid;place-items:center;flex:none;color:var(--navy)}
.iconbtn svg{width:20px;height:20px;stroke-width:3}
.iconbtn:disabled{opacity:.25;cursor:default}
.iconbtn.del{background:var(--blush);color:var(--burgundy)}
.elist{display:flex;flex-direction:column;gap:8px}
.muted{color:#5A6878;font-weight:600;font-size:.95rem;padding:4px 2px}

#editExtras{display:flex;flex-direction:column;gap:14px}
.addcard{background:#fff;border:2.5px solid var(--navy);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:5px 5px 0 var(--navy)}
.addcard h2{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0}
.addrow{display:flex;gap:10px}
.addrow input{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:700;padding:11px 14px;border-radius:14px;border:2.5px solid var(--navy);background:var(--paper);color:var(--navy)}
.picked{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--navy);background:var(--blush);flex:none;display:grid;place-items:center;color:var(--navy)}
.picked svg{width:32px;height:32px;stroke-width:2}
.label{font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--forest)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cats button{border:2px solid var(--navy);border-radius:14px;padding:10px 8px;font-weight:800;background:#fff}
.cats button[aria-pressed="true"]{color:#fff;box-shadow:3px 3px 0 var(--navy)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.picker button{height:52px;border-radius:14px;border:2px solid var(--navy);background:#fff;display:grid;place-items:center;color:var(--navy)}
.picker button svg{width:30px;height:30px;stroke-width:2}
.picker button[aria-pressed="true"]{background:var(--blush);box-shadow:3px 3px 0 var(--navy)}
.primary{font-weight:800;font-size:1.1rem;background:var(--burgundy);color:#fff;border:2.5px solid var(--navy);border-radius:16px;padding:12px 16px;box-shadow:4px 4px 0 var(--navy)}
.primary:disabled{opacity:.45;cursor:default;box-shadow:none}
.ghost{background:none;border:0;color:var(--navy);font-weight:800;font-size:1rem;padding:8px 2px;align-self:flex-start;text-decoration:underline;text-underline-offset:3px}
.confirm{background:#fff;border:2.5px solid var(--navy);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:center;font-weight:700}
.confirm div{display:flex;gap:16px;justify-content:center;align-items:center}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--blush);border-top:2.5px solid var(--navy);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:12px}
.dock button{flex:1;height:56px;border:2.5px solid var(--navy);border-radius:18px;font-weight:800;font-size:1.15rem;box-shadow:4px 4px 0 var(--navy);transition:transform .1s,box-shadow .1s}
.dock button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--navy)}
.btn-new{background:var(--burgundy);color:#fff}
.btn-edit{background:#fff;color:var(--navy)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:6;
  background:var(--navy);color:#fff;border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-weight:800;max-width:calc(100% - 32px)}
.toast button{background:var(--mustard);border:0;color:#fff;font-weight:800;padding:6px 12px;border-radius:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 72 72" aria-hidden="true">
        <rect x="6" y="8" width="60" height="60" rx="18" fill="#001E3F"/>
        <rect x="2" y="3" width="60" height="60" rx="18" fill="#A86F16" stroke="#001E3F" stroke-width="3.5"/>
        <path d="M23 25v-7a9 9 0 0 1 18 0v7" fill="none" stroke="#001E3F" stroke-width="4.5" stroke-linecap="round"/>
        <rect x="11" y="25" width="42" height="29" rx="9" fill="#8A5862" stroke="#001E3F" stroke-width="3.5"/>
        <path d="M23 39l6 6 11-11" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <h1>Pusletasken</h1>
        <span class="tag">Alt det, der skal med, når vi tager afsted</span>
      </div>
    </div>
    <h2 class="mode" id="modeTitle" hidden>Ret din liste</h2>
    <div class="status" id="status"><div class="bar"><span id="fill"></span></div><span class="count" id="count">0/0</span></div>
    <div class="ready" id="ready" hidden>Alt er pakket. God tur!</div>
  </header>
  <div id="list" style="display:flex;flex-direction:column;gap:26px"></div>
  <div id="editExtras" hidden>
    <div class="addcard">
      <h2>Tilføj noget</h2>
      <div class="addrow">
        <span class="picked" id="picked" aria-hidden="true"></span>
        <input id="newName" type="text" placeholder="F.eks. solcreme" maxlength="40" autocomplete="off" aria-label="Navn på ting">
      </div>
      <span class="label">Kategori</span>
      <div class="cats" id="catPick"></div>
      <span class="label">Vælg et billede</span>
      <div class="picker" id="picker"></div>
      <button class="primary" id="addBtn" type="button" disabled>Tilføj til listen</button>
    </div>
    <button class="ghost" id="resetDefaults" type="button">Gendan standardlisten</button>
    <div class="confirm" id="confirmReset" hidden>
      Din liste bliver erstattet af standardlisten.
      <div>
        <button class="primary" id="yesReset" type="button">Erstat listen</button>
        <button class="ghost" id="noReset" type="button">Behold min</button>
      </div>
    </div>
  </div>
</div>

<nav class="dock"><div class="in">
  <button class="btn-new" id="newOuting" type="button">Ny tur</button>
  <button class="btn-edit" id="editBtn" type="button">Ret listen</button>
</div></nav>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="undo" type="button">Fortryd</button></div>

<script>
document.documentElement.lang = "da";
const ICON = {
  bleer:"M3 7h18v2c0 5-4 9-9 9s-9-4-9-9z M3 10.5h4 M17 10.5h4",
  puslemaatte:"M3 8h18a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z M9 8v8 M15 8v8",
  vaadservietter:"M4 10h16a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z M9 10c0-2.5 6-2.5 6 0 M10 6.5c1-1.5 3-1.5 4 0",
  bleposer:"M7 8h10l1 12H6z M9.5 8V6.5a2.5 2.5 0 0 1 5 0V8",
  stofble:"M5 5h14v14H5z M5 10h14 M5 14.5h14",
  skiftetoej:"M9 4h6l4 3-2 3-2-1v11H9V9l-2 1-2-3z M10 4a2 2 0 0 0 4 0",
  mad:"M3 11h18a9 7 0 0 1-18 0z M8 20.5h8 M9.5 8c0-1.5 1.5-1.5 1.5-3 M13.5 8c0-1.5 1.5-1.5 1.5-3",
  vandflaske:"M10 3h4v3h-4z M9 6h6l1 3v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9z M8 13h8",
  ske:"M12 3c2.5 0 3.2 2 3.2 4s-1.6 4-3.2 4-3.2-2-3.2-4 .7-4 3.2-4z M12 11v10",
  sutteflaske:"M11 2h2l1 3h-4z M9 5h6v3H9z M8 8h8v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z M8 12h3 M8 16h3",
  snack:"M12 7c-3-2-8 0-7 5s4 9 7 7c3 2 6-2 7-7s-4-7-7-5z M12 7c0-2 1-3 3-4",
  taeppe:"M3 6h18v12H3z M3 12h18 M7 9h2 M7 15h2 M15 9h2 M15 15h2",
  nusseklud:"M9.5 10V5.5a1.5 1.5 0 0 1 3 0V10 M11.5 10V5.5a1.5 1.5 0 0 1 3 0V10 M6 15a6 4.5 0 1 0 12 0a6 4.5 0 1 0-12 0 M10 14.5h.01 M14 14.5h.01",
  legetoej:"M4 9a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M10.8 11.8l6.5 6.5 M16.6 20.3a2 2 0 1 0 3.7-3.7",
  monitor:"M9 3l2 4 M8 7h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z M9 10h6v4H9z M10 17.5h.01 M14 17.5h.01",
  sut:"M12 9V6 M10 6a2 2 0 0 1 4 0 M5 12a7 3 0 1 0 14 0a7 3 0 1 0-14 0 M10 18.5a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M12 15v1.5",
  bog:"M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2a2 2 0 0 0 2 2h13",
  jakke:"M9 3L4 6v14h16V6l-5-3 M9 3l3 4 3-4 M12 7v13 M8 20v-8 M16 20v-8",
  hue:"M5 16a7 7 0 0 1 14 0z M4 16h16v3H4z M11 5a1 1 0 1 0 2 0a1 1 0 1 0-2 0",
  solhat:"M2 15c0 2 4.5 3 10 3s10-1 10-3 M6 15.5c0-4 2.5-8 6-8s6 4 6 8 M6.5 13h11",
  regnslag:"M7 14a4 4 0 0 1 .5-8 5 5 0 0 1 9.5 1.5A3.5 3.5 0 0 1 17 14z M8 17l-1 2.5 M12 17l-1 2.5 M16 17l-1 2.5",
  vanter:"M7 17V9a4 4 0 0 1 8 0v2l2-2a1.5 1.5 0 0 1 2 2l-4 5v1z M7 17h8v4H7z",
  paraply:"M3 12a9 9 0 0 1 18 0z M12 12v7a2 2 0 0 1-4 0 M12 3v0",
  sol:"M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M12 2v2 M12 20v2 M2 12h2 M20 12h2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4",
  solbriller:"M2 10h20 M3 10l1 5a2 2 0 0 0 2 1.5h2a2 2 0 0 0 2-1.5l1-5 M13 10l1 5a2 2 0 0 0 2 1.5h2a2 2 0 0 0 2-1.5l1-5",
  klapvogn:"M3 4h2l2.5 9H18 M8 13a6 6 0 0 1 6-6h4v6 M7 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M15 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0",
  medicin:"M4.5 10.5l6-6a4.24 4.24 0 0 1 6 6l-6 6a4.24 4.24 0 0 1-6-6z M7.5 7.5l6 6",
  termometer:"M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z M12 9v7",
  noegler:"M4 15a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M10.8 12.2L19 4 M15.5 7.5l2 2 M13 10l2 2",
  telefon:"M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z M11 18h2",
  pung:"M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z M3 9l12-5 2 3 M15 13.5h2",
  taske:"M5 8h14l-1 12H6z M9 8V6a3 3 0 0 1 6 0v2",
  stjerne:"M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 16.6 6.7 19.5l1.1-6L3.4 9.3l6-.8z",
  maane:"M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"
};
const PICKER = Object.keys(ICON).filter(k => k !== "maane");
const svg = k => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[k]||ICON.stjerne}"/></svg>`;
const CATS = [
  {id:"ble", name:"Bleskift", icon:"bleer", strong:"#8A5862", soft:"#E3C6BD"},
  {id:"mad", name:"Mad & Drikke", icon:"mad", strong:"#94600F", soft:"#EBD7B3"},
  {id:"sov", name:"Søvn & Leg", icon:"maane", strong:"#001E3F", soft:"#C9D5DD"},
  {id:"vej", name:"Tøj til vejret", icon:"sol", strong:"#4B573D", soft:"#D3D8CA"}
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const STARTER = [
  ["ble","bleer","Bleer"],["ble","puslemaatte","Puslemåtte"],["ble","vaadservietter","Vådservietter"],["ble","bleposer","Bleposer"],["ble","stofble","Stofble"],["ble","skiftetoej","Skiftetøj"],
  ["mad","mad","Mad"],["mad","vandflaske","Vandflaske"],["mad","ske","Ske"],
  ["sov","taeppe","Tæppe"],["sov","nusseklud","Nusseklud"],["sov","legetoej","Legetøj"],["sov","monitor","Monitor"],
  ["vej","jakke","Varmt tøj"],["vej","hue","Hue / Solhat"],["vej","regnslag","Regnslag"]
];
const TILT = [-1, 1, 0.5, -0.5];
const KEY = "out-the-door-v1";
function fresh(){return{v:2,items:STARTER.map(([cat,icon,name],i)=>({id:"s"+i,cat,icon,name,done:false}))}}
// Lists saved by earlier versions: unchanged starter lists get the new one; custom lists keep their items, sorted into categories
const OLD_STARTERS = [
  "Nappies|Wipes|Changing mat|Nappy bags|Nappy cream|Spare clothes|Bottle / milk|Snacks & spoon|Bib & muslin|Dummy|Favourite toy|Blanket|Hat|Keys|Phone|Wallet",
  "Bleer|Vådservietter|Puslepude|Bleposer|Babycreme|Skiftetøj|Sutteflaske / mælk|Snacks og ske|Hagesmæk og stofble|Sut|Yndlingslegetøj|Tæppe|Hue|Nøgler|Telefon|Pung",
  "Bleer|Puslemåtte|Vådservietter|Bleposer|Stofble|Skiftetøj|Hue|Tæppe|Nusseklud|Legetøj|Mad|Vandflaske|Ske|Monitor|Regnslag",
  "Bleer|Puslemåtte|Vådservietter|Bleposer|Stofble|Skiftetøj|Varmt tøj|Hue|Solhat|Tæppe|Nusseklud|Legetøj|Mad|Vandflaske|Ske|Monitor|Regnslag",
  "Bleer|Puslemåtte|Vådservietter|Bleposer|Stofble|Skiftetøj|Varmt tøj|Hue / Solhat|Tæppe|Nusseklud|Legetøj|Mad|Vandflaske|Ske|Monitor|Regnslag"
];
const ICON_CAT = {mad:"mad",vandflaske:"mad",ske:"mad",sutteflaske:"mad",snack:"mad",
  taeppe:"sov",nusseklud:"sov",legetoej:"sov",monitor:"sov",sut:"sov",bog:"sov",
  jakke:"vej",hue:"vej",solhat:"vej",regnslag:"vej",vanter:"vej",paraply:"vej",sol:"vej",solbriller:"vej"};
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.items)){
      if(s.v===2) return s;
      if(OLD_STARTERS.includes(s.items.map(i=>i.name).join("|"))) return fresh();
      const items = s.items.map(it=>({...it, icon: ICON[it.icon]?it.icon:"stjerne", cat: ICON_CAT[it.icon]||"ble"}));
      return {v:2, items: CATS.flatMap(c=>items.filter(i=>i.cat===c.id))};
    }
  }catch(e){}
  return fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

let state = load(), editing = false, chosen = "legetoej", chosenCat = "ble", undoFn = null, toastT;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const UP = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5 M6 11l6-6 6 6"/></svg>';
const DOWN = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M6 13l6 6 6-6"/></svg>';
const X = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg>';
const TICK = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function render(){
  const items = state.items, n = items.length, d = items.filter(i=>i.done).length;
  $("count").textContent = `${d}/${n}`;
  $("fill").style.width = n ? (d/n*100)+"%" : "0";
  $("modeTitle").hidden = !editing; $("status").hidden = editing;
  $("ready").hidden = editing || !n || d < n;
  $("editExtras").hidden = !editing;
  $("editBtn").textContent = editing ? "Færdig" : "Ret listen";
  $("newOuting").hidden = editing;
  $("list").innerHTML = CATS.map(c=>{
    const mine = items.map((it,idx)=>({it,idx})).filter(x=>x.it.cat===c.id);
    if(!mine.length && !editing) return "";
    const got = mine.filter(x=>x.it.done).length;
    const head = `<div class="cat-head"><span class="cat-ic" style="background:${c.strong}">${svg(c.icon)}</span><h2>${c.name}</h2>${editing?"":`<span class="chip" style="background:${c.soft}">${got}/${mine.length}</span>`}</div>`;
    if(editing){
      const rows = mine.length ? mine.map(({it,idx},k)=>`<div class="erow"><span class="pic" style="background:${c.soft}">${svg(it.icon)}</span><span class="name">${esc(it.name)}</span>
        <button class="iconbtn" data-up="${idx}" ${k===0?"disabled":""} aria-label="Flyt ${esc(it.name)} op">${UP}</button>
        <button class="iconbtn" data-down="${idx}" ${k===mine.length-1?"disabled":""} aria-label="Flyt ${esc(it.name)} ned">${DOWN}</button>
        <button class="iconbtn del" data-del="${idx}" aria-label="Fjern ${esc(it.name)}">${X}</button></div>`).join("") : `<p class="muted">Ingen ting her endnu.</p>`;
      return `<section class="cat">${head}<div class="elist">${rows}</div></section>`;
    }
    const tiles = mine.map(({it,idx},k)=>`<button class="tile" role="checkbox" aria-checked="${it.done}" data-tog="${idx}" style="background:${it.done?c.soft:"#fff"};transform:rotate(${TILT[k%4]}deg)">
      <span class="pic" style="background:${c.soft}">${svg(it.icon)}</span><span class="name">${esc(it.name)}</span>
      ${it.done?`<span class="badge" style="background:${c.strong}">${TICK}</span>`:""}</button>`).join("");
    return `<section class="cat">${head}<div class="grid">${tiles}</div></section>`;
  }).join("");
}

function toast(msg, undo){
  $("toastMsg").textContent = msg; undoFn = undo; $("undo").hidden = !undo; $("toast").hidden = false;
  clearTimeout(toastT); toastT = setTimeout(()=>{$("toast").hidden = true; undoFn = null}, 4500);
}
function neighbour(idx, dir){
  const it = state.items, cat = it[idx].cat;
  for(let j = idx+dir; j>=0 && j<it.length; j+=dir) if(it[j].cat===cat) return j;
  return -1;
}
$("list").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return; const it = state.items;
  if(b.dataset.tog!==undefined){const x=it[+b.dataset.tog]; x.done=!x.done;}
  else if(b.dataset.up!==undefined||b.dataset.down!==undefined){
    const i=+(b.dataset.up ?? b.dataset.down), j=neighbour(i, b.dataset.up!==undefined?-1:1);
    if(j>-1)[it[i],it[j]]=[it[j],it[i]];
  }
  else if(b.dataset.del!==undefined){
    const i=+b.dataset.del, gone=it.splice(i,1)[0];
    toast(`${gone.name} er fjernet`, ()=>{state.items.splice(i,0,gone);save();render()});
  }
  save(); render();
});
$("newOuting").onclick = ()=>{
  const prev = state.items.map(i=>i.done);
  if(!prev.some(Boolean)){toast("Listen er allerede nulstillet");return}
  state.items.forEach(i=>i.done=false); save(); render();
  toast("Klar til en ny tur", ()=>{state.items.forEach((i,k)=>i.done=prev[k]);save();render()});
  window.scrollTo({top:0,behavior:"smooth"});
};
$("editBtn").onclick = ()=>{editing=!editing; $("confirmReset").hidden=true; render(); window.scrollTo({top:0})};
$("undo").onclick = ()=>{if(undoFn) undoFn(); $("toast").hidden=true; undoFn=null};

function drawPicked(){ $("picked").innerHTML = svg(chosen); }
function drawCats(){ $("catPick").innerHTML = CATS.map(c=>`<button type="button" data-cat="${c.id}" aria-pressed="${c.id===chosenCat}" style="${c.id===chosenCat?`background:${c.strong}`:""}">${c.name}</button>`).join(""); }
$("picker").innerHTML = PICKER.map(k=>`<button type="button" aria-pressed="${k===chosen}" data-ic="${k}" aria-label="${k}">${svg(k)}</button>`).join("");
drawPicked(); drawCats();
$("catPick").addEventListener("click", e=>{const b=e.target.closest("button"); if(!b) return; chosenCat=b.dataset.cat; drawCats();});
$("picker").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return; chosen=b.dataset.ic; drawPicked();
  $("picker").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
});
$("newName").addEventListener("input", ()=>{$("addBtn").disabled = !$("newName").value.trim()});
function addItem(){
  const name=$("newName").value.trim(); if(!name) return;
  let at = state.items.length; for(let j=state.items.length-1;j>=0;j--) if(state.items[j].cat===chosenCat){at=j+1;break}
  state.items.splice(at,0,{id:"u"+Date.now(),cat:chosenCat,icon:chosen,name,done:false});
  $("newName").value=""; $("addBtn").disabled=true; save(); render(); toast(`${name} er tilføjet under ${CAT[chosenCat].name}`);
}
$("addBtn").onclick = addItem;
$("newName").addEventListener("keydown", e=>{if(e.key==="Enter"){e.preventDefault();addItem()}});
$("resetDefaults").onclick = ()=>{$("confirmReset").hidden=false};
$("noReset").onclick = ()=>{$("confirmReset").hidden=true};
$("yesReset").onclick = ()=>{state=fresh(); save(); $("confirmReset").hidden=true; render(); toast("Standardlisten er gendannet")};
render();
</script>

</html>
